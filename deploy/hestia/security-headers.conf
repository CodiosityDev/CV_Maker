# CV Maker — response headers for every page and asset (nginx equivalent of static/_headers).
# Installed to /etc/nginx/snippets/cvmaker-security-headers.conf by install.sh and included
# in each `location` of cv-static.stpl (nginx drops server-level add_header in any location
# that sets its own, so the include is repeated there on purpose).
#
# The main CSP with script hashes is emitted by SvelteKit as a <meta> tag (vite.config.ts).
# This header adds the directives a <meta> CSP cannot set. Browsers enforce both.

add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
